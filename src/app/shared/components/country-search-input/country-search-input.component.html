<section class="flex flex-row gap-2 mt-2">

	<input type="text"
		class="input input-bodered mr-2 w-56"
		[placeholder]="placeholder()"
		autofocus
		#txtSearch
		(keyup.enter)="messageEvent.emit(txtSearch.value)"
		(keyup)="inputValue.set(txtSearch.value)"
	>

	<button class="btn btn-primary" (click)="messageEvent.emit(txtSearch.value)">
		Buscar
	</button>


</section>
